<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTE2026-27 admission ડેશબોર્ડ</title>
    
    <!-- સ્પષ્ટ ગુજરાતી ફોન્ટ્સ માટે -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- લાઇબ્રેરીઓ (Plugins) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        /* મોડર્ન ડેશબોર્ડ ડિઝાઇન */
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8;
            --success: #10b981; --success-hover: #059669;
            --danger: #ef4444; --danger-hover: #dc2626;
            --bg-color: #f1f5f9; --card-bg: #ffffff;
            --text-main: #0f172a; --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body { font-family: 'Noto Sans Gujarati', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: var(--text-main); }
        
        .dashboard-container { max-width: 1400px; margin: 0 auto; }
        
        .header { background: var(--card-bg); padding: 20px 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;}
        .header h1 { margin: 0; font-size: 24px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        /* ફિલ્ટર એરિયા ડિઝાઇન */
        .filter-section { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .filter-section-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: var(--text-muted); border-bottom: 2px solid var(--border-color); padding-bottom: 8px;}
        
        .dynamic-filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
        select { padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 14px; outline: none; background: #f8fafc; font-family: inherit; transition: 0.2s;}
        select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); background: white;}

        /* બટન ડિઝાઇન */
        .action-buttons { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        button { padding: 10px 18px; border-radius: 8px; font-size: 15px; font-weight: 600; color: white; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; font-family: inherit;}
        .btn-refresh { background-color: var(--primary); } .btn-refresh:hover { background-color: var(--primary-hover); }
        .btn-excel { background-color: var(--success); } .btn-excel:hover { background-color: var(--success-hover); }
        .btn-pdf { background-color: var(--danger); } .btn-pdf:hover { background-color: var(--danger-hover); }
        .btn-print { background-color: var(--text-muted); } .btn-print:hover { background-color: var(--text-main); }

        /* રિપોર્ટ ટેબલ ડિઝાઇન */
        .report-section { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .report-header h2 { margin: 0; font-size: 20px; }
        .summary-badge { background: #dbeafe; color: var(--primary); padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }

        .table-container { overflow-x: auto; max-height: 65vh; border-radius: 8px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; font-size: 14px; }
        th, td { border-bottom: 1px solid var(--border-color); padding: 12px 15px; text-align: left; }
        th { background-color: #f8fafc; color: var(--text-main); font-weight: 700; position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 0 var(--border-color); white-space: nowrap;}
        tr:hover td { background-color: #f1f5f9; }

        #loading { display: none; text-align: center; padding: 20px; color: var(--primary); font-weight: bold; font-size: 16px; }

        @media print {
            body { background: white; padding: 0; }
            .header, .filter-section, .action-buttons { display: none !important; }
            .report-section { box-shadow: none; padding: 0; }
            .table-container { max-height: none; border: none; overflow: visible;}
            th { position: static; box-shadow: none; border: 1px solid #000; }
            td { border: 1px solid #000; padding: 6px; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <div class="header">
            <h1>🏫 સ્માર્ટ એડમિન ડેશબોર્ડ</h1>
            <!-- ડેટા રિફ્રેશ બટન -->
            <button class="btn-refresh" onclick="loadData(true)">🔄 નવો ડેટા લાવો (Refresh)</button>
        </div>

        <div class="filter-section">
            <div class="filter-section-title">માહિતી ફિલ્ટર કરો (કોઈપણ કોલમ પરથી)</div>
            
            <div id="dynamicFilters" class="dynamic-filters"></div>
            
            <div class="action-buttons">
                <button class="btn-excel" onclick="downloadExcel()">📊 Excel ડાઉનલોડ</button>
                <button class="btn-pdf" onclick="downloadPDF()">📄 PDF ડાઉનલોડ</button>
                <button class="btn-print" onclick="window.print()">🖨️ પ્રિન્ટ કરો</button>
            </div>
        </div>

        <div id="loading">⏳ ડેટા પ્રોસેસ થઈ રહ્યો છે...</div>

        <div class="report-section" id="reportArea">
            <div class="report-header">
                <h2 id="reportTitle">રિપોર્ટ વિગતો</h2>
                <div id="totalCount" class="summary-badge">કુલ રેકોર્ડ: 0</div>
            </div>
            
            <div class="table-container">
                <table id="dataTable">
                    <thead><tr id="tableHeader"></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // તમારી નવી લિંક અહી ઉમેરેલી છે
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTrFTnUAweG-aWi73TadMUNzSAIt5ll94eGQv8hQ_GJ6wVFDuZ16rn9xlAJr9MA_v7jyPZbtSUZsqEx/pub?gid=910875912&single=true&output=csv";
        const CACHE_KEY = "schoolDataCache_New";
        
        let allData = [];
        let headers = [];

        window.onload = () => loadData(false);

        function loadData(forceRefresh) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('tableBody').innerHTML = '';
            
            const cachedData = localStorage.getItem(CACHE_KEY);

            if (cachedData && !forceRefresh) {
                processCSV(cachedData);
            } else {
                fetch(SHEET_URL)
                    .then(response => response.text())
                    .then(csvText => {
                        localStorage.setItem(CACHE_KEY, csvText); 
                        processCSV(csvText);
                    })
                    .catch(error => {
                        alert("ઇન્ટરનેટ એરર! કૃપા કરીને કનેક્શન તપાસો.");
                        document.getElementById('loading').style.display = 'none';
                    });
            }
        }

        function processCSV(csvText) {
            Papa.parse(csvText, {
                header: false,
                skipEmptyLines: true,
                complete: function(results) {
                    let rawData = results.data;
                    
                    let headerIndex = 0;
                    for(let i=0; i<10; i++) {
                        if(rawData[i] && rawData[i].join("").includes("શાળાનું નામ")) {
                            headerIndex = i; break;
                        }
                    }
                    
                    headers = rawData[headerIndex];
                    allData = rawData.slice(headerIndex + 1).filter(row => row.length > 2 && row[0]); 

                    document.getElementById('loading').style.display = 'none';
                    buildDynamicFilters();
                    generateReport();
                }
            });
        }

        function buildDynamicFilters() {
            const container = document.getElementById('dynamicFilters');
            container.innerHTML = '';

            headers.forEach((header, index) => {
                if(!header || header.trim() === "" || header.includes("Count of") || header === "sr" || header === "ક્રમ") return;

                let uniqueValues = new Set();
                allData.forEach(row => {
                    if(row[index] && row[index].trim() !== "") {
                        uniqueValues.add(row[index].trim());
                    }
                });

                if(uniqueValues.size > 0 && uniqueValues.size < allData.length * 0.9) {
                    
                    let group = document.createElement('div');
                    group.className = 'filter-group';
                    
                    let label = document.createElement('label');
                    label.innerText = header;
                    
                    let select = document.createElement('select');
                    select.id = 'filter_' + index;
                    select.onchange = generateReport;

                    select.innerHTML = '<option value="All">બધા (All)</option>';
                    
                    Array.from(uniqueValues).sort().forEach(val => {
                        let option = document.createElement('option');
                        option.value = val; option.text = val;
                        select.appendChild(option);
                    });

                    group.appendChild(label);
                    group.appendChild(select);
                    container.appendChild(group);
                }
            });
        }

        function generateReport() {
            const tableHeader = document.getElementById('tableHeader');
            const tableBody = document.getElementById('tableBody');
            
            tableHeader.innerHTML = '';
            tableBody.innerHTML = '';

            headers.forEach(h => {
                let th = document.createElement('th');
                th.innerText = h;
                tableHeader.appendChild(th);
            });

            let count = 0;
            
            allData.forEach(row => {
                let isMatch = true;

                headers.forEach((h, index) => {
                    let selectBox = document.getElementById('filter_' + index);
                    if(selectBox && selectBox.value !== 'All') {
                        let cellValue = row[index] ? row[index].trim() : "";
                        if(cellValue !== selectBox.value) {
                            isMatch = false;
                        }
                    }
                });

                if(isMatch) {
                    let tr = document.createElement('tr');
                    row.forEach(col => {
                        let td = document.createElement('td');
                        td.innerText = col;
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                    count++;
                }
            });

            if(count === 0){
                tableBody.innerHTML = `<tr><td colspan="${headers.length}" style="text-align:center; color:red; padding: 20px;">કોઈ માહિતી મળી નથી!</td></tr>`;
            }

            document.getElementById('totalCount').innerText = `કુલ રેકોર્ડ: ${count}`;
        }

        // નવી એડવાન્સ Excel ડાઉનલોડ સિસ્ટમ (કોલમ સાઈઝ સાથે)
        function downloadExcel() {
            var table = document.getElementById('dataTable');
            var wb = XLSX.utils.table_to_book(table, {sheet:"Report", raw: true});
            var ws = wb.Sheets["Report"];

            // ઑટો-ફિટ કોલમ લંબાઈ (Auto-fit Columns Logic)
            var colWidths = [];
            for (var i = 0; i < table.rows[0].cells.length; i++) {
                var maxWidth = 10; // ન્યૂનતમ લંબાઈ 10 રાખીએ
                for (var j = 0; j < table.rows.length; j++) {
                    var cellText = table.rows[j].cells[i].innerText;
                    if (cellText && cellText.length > maxWidth) {
                        maxWidth = cellText.length;
                    }
                }
                // ગુજરાતી શબ્દો માટે થોડી વધારાની જગ્યા (Padding) ઉમેરીએ
                colWidths.push({ wch: maxWidth + 5 }); 
            }
            
            // Excel ફાઇલમાં કોલમની લંબાઈ લાગુ પાડો
            ws['!cols'] = colWidths;

            // ફાઈલ સેવ કરો
            XLSX.writeFile(wb, "Smart_Report.xlsx");
        }

        function downloadPDF() {
            var element = document.getElementById('reportArea');
            var opt = {
                margin:       0.2,
                filename:     'Smart_Report.pdf',
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 3, useCORS: true, letterRendering: true }, 
                jsPDF:        { unit: 'in', format: 'a3', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
